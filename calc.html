<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #222;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #display {
            width: 100%;
            height: 75px;
            margin-bottom: 15px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #eee;
            color: #222;
            font-size: 30px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
            background: #444;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #666;
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #e08700;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #c0392b;
        }

        .equal {
            background: #27ae60;
            grid-column: span 2;
        }

        .equal:hover {
            background: #219150;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <input type="text" id="display" value="0"
               readonly aria-label="Calculator display">

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="chooseOperator('%')">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let current = "0";
        let previous = null;
        let operator = null;
        let resetNext = false;

        function updateDisplay() {
            display.value = current;
        }

        function appendNumber(number) {
            if (current === "Error" || resetNext) {
                current = number;
                resetNext = false;
            } else {
                current = current === "0" ? number : current + number;
            }
            updateDisplay();
        }

        function appendDecimal() {
            if (current === "Error" || resetNext) {
                current = "0.";
                resetNext = false;
            } else if (!current.includes(".")) {
                current += ".";
            }
            updateDisplay();
        }

        function chooseOperator(nextOperator) {
            if (current === "Error") return;

            if (operator && !resetNext) {
                calculate();
            }

            previous = Number(current);
            operator = nextOperator;
            resetNext = true;
        }

        function calculate() {
            if (operator === null || previous === null ||
                current === "Error") return;

            const a = previous;
            const b = Number(current);
            let result;

            switch (operator) {
                case "+":
                    result = a + b;
                    break;
                case "-":
                    result = a - b;
                    break;
                case "*":
                    result = a * b;
                    break;
                case "/":
                    result = b === 0 ? "Error" : a / b;
                    break;
                case "%":
                    result = b === 0 ? "Error" : a % b;
                    break;
            }

            current = result === "Error"
                ? "Error"
                : String(Number(result.toPrecision(12)));

            previous = null;
            operator = null;
            resetNext = true;
            updateDisplay();
        }

        function clearDisplay() {
            current = "0";
            previous = null;
            operator = null;
            resetNext = false;
            updateDisplay();
        }

        function deleteLast() {
            if (current === "Error" || resetNext) {
                current = "0";
                resetNext = false;
            } else {
                current = current.length > 1
                    ? current.slice(0, -1)
                    : "0";

                if (current === "-") current = "0";
            }
            updateDisplay();
        }
    </script>

</body>
</html>
